# ---------------------------------------------------------------------------
# HTTPS：两种方式
#
#   A. nginx 终止 TLS（推荐）。在上面任一 server 块里加上：
#        listen 443 ssl;
#        ssl_certificate     /etc/nginx/ssl/files.example.com.crt;
#        ssl_certificate_key /etc/nginx/ssl/files.example.com.key;
#      此时 X-Forwarded-Proto $scheme 会传 "https"，配了 --trusted-proxies
#      后 gofs 生成的分享链接、脚本地址自动是 https，cookie 也会带 Secure。
#
#   B. gofs 自己上 TLS：
#        gofs --tls-cert /path/cert.pem --tls-key /path/key.pem ...
#      此时上游改成 proxy_pass https://127.0.0.1:5000;（如需校验证书再配
#      proxy_ssl_* 系列），或者干脆用 stream 模块做四层转发。
# ---------------------------------------------------------------------------


# ---------------------------------------------------------------------------
# 可选：在 nginx 侧再做一层认证入口限速
#
#   gofs 自身已经按「账号 / 来源 IP / 全局」三个维度限制认证失败，为什么
#   还要 nginx？因为 nginx 的 limit_req 在连接层就更早生效：恶意请求不必
#   进入 Go 进程、不必触发 PBKDF2，就能被挡掉。两层是叠加关系，不是替代。
#
#   如果配置，务必使用 $binary_remote_addr（二进制紧凑形式，IPv6 也只需
#   很少内存），不要用 $remote_addr（字符串做键，IPv6 下内存开销大得多）。
#
#   ⚠️ 信任边界：$binary_remote_addr 是**直连 nginx 的对端地址**。
#   只有「nginx 是唯一入口」时它才等于真实客户端；如果 nginx 前面还有
#   一层 CDN/负载均衡，这里拿到的是上一跳代理的地址，所有客户端会共用
#   同一个限速桶。那种情况下应改用 real_ip 模块，并且只信任 CDN 的
#   set_real_ip_from 网段。
#
#   还要注意：HTTP/2 或 HTTP/3 下，浏览器可能对同一来源复用一条连接，
#   连接级限速与请求级限速的粒度不同；需要按请求限速时用 limit_req
#   （它按请求计数），而不是 limit_conn。
#
#   http {} 块（不在 server 里）：
#     limit_req_zone $binary_remote_addr zone=gofs_auth:10m rate=10r/m;
#     limit_req_status 429;
#
#   server {} 块里只对认证入口限速，别包住文件传输：
#     location = /fs/auth {
#         limit_req zone=gofs_auth burst=5 nodelay;
#         proxy_pass http://127.0.0.1:5000;
#         # 其余 proxy_set_header 与场景一相同
#     }
#     location = / {
#         limit_req zone=gofs_auth burst=5 nodelay;
#         proxy_pass http://127.0.0.1:5000;
#         # 其余 proxy_set_header 与场景一相同
#     }
#
#   不要给 /fs/extract、/fs/text、/fs/office 或普通文件下载路径加同一个
#   zone：那些是认证通过后的数据面请求，限速会误伤大文件传输。
# ---------------------------------------------------------------------------
