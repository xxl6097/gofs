# gofs 反向代理参考配置（nginx）
#
# 用法：把下面某个 server 块拷进你的 nginx 配置，改掉 server_name / 端口即可。
# 三个场景按需取其一：
#
#   场景一  根路径代理            —— gofs 监听本机端口，nginx 独占对外 80/443
#   场景二  子路径代理 /files/     —— gofs 加 --path-prefix /files，nginx 不剥前缀
#   场景三  unix socket 代理       —— gofs -b /run/gofs.sock，同机最干净
#
# 四条硬性约束（漏掉任何一条都会出问题）：
#
#   1) Host 必须原样透传。gofs 的跨站写校验比的是 Origin/Referer 的 host 与
#      r.Host 是否同源（internal/server/guard.go），改写成 127.0.0.1:5000 会让
#      自己页面的 POST/PUT/DELETE 全被 403。分享链接与一键脚本的地址也取自
#      r.Host（internal/server/up_script.go），写错了就会生成指向 127.0.0.1
#      的链接。
#   2) proxy_buffering off。在线解压进度走 SSE（text/event-stream），开着缓冲
#      会攒到结束才吐，进度条全程不动。
#   3) client_max_body_size 要放开。gofs 单次上传默认上限 10GiB，nginx 默认
#      1m 会先把它挡在门外；再配上 proxy_request_buffering off，避免 nginx
#      先把整个上传体缓冲到磁盘再转发。
#   4) gofs 启动时加 --trusted-proxies 127.0.0.1（unix socket 同理）。gofs
#      默认不采信任何转发头；不配的话限速与日志看到的都是代理地址，
#      X-Forwarded-Proto 也不会被采纳，分享链接会退回 http://。
#
# 另外 gofs 没有 WebSocket，不需要 Upgrade/Connection 头（例外见场景三里
# 为 upstream keepalive 设的 Connection ""）。


# ---------------------------------------------------------------------------
# 场景一：根路径代理
#
#   gofs -b 127.0.0.1 -p 5000 --trusted-proxies 127.0.0.1 /data -a 'admin:密码@/data:rw'
# ---------------------------------------------------------------------------
server {
    listen      80;
    server_name files.example.com;

    # 0 = 不限制。想收紧就写具体值（如 10g），别留着默认的 1m。
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Host 原样透传，见文件头第 1 条。用 $http_host（保留端口）而不是 $host。
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # 需 --trusted-proxies，否则被忽略

        # SSE 进度推送必须关缓冲。
        proxy_buffering off;
        proxy_cache     off;

        # 大文件上传/下载：别先落盘再转发，也别让默认 60s 掐断长连接。
        proxy_request_buffering off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
    }
}


# ---------------------------------------------------------------------------
# 场景二：子路径代理（把 gofs 挂在别的站点的 /files/ 下）
#
#   gofs -b 127.0.0.1 -p 5000 --path-prefix /files --trusted-proxies 127.0.0.1 /data -a 'admin:密码@/data:rw'
#
# 关键：proxy_pass 结尾**不要**带 "/"。带了会把 /files 前缀剥掉，而 gofs 的
# --path-prefix 需要看到它；剥掉之后页面里生成的链接会少一段。
# ---------------------------------------------------------------------------
