<!DOCTYPE html>
<!-- class="booting" 是「启动遮挡」：页面外壳在服务端就渲染好了，但
     「要不要登录」得等 app.js 跑起来才知道。不挡住的话，未登录刷新时
     会先看到一眼完整的文件界面，再被登录框盖掉 —— 就是那个一闪而过的背景。
     撤除由 app.js 的 endBoot() 负责，样式见 style.css 的「启动遮挡」一节。 -->
<html lang="zh-CN" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>gofs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M8 11h6l2 2h8v9a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="__GOFS_ASSETS__style.css">
<script>
  // 兜底：万一 app.js 加载失败或中途抛异常，就没人来撤遮挡了。
  // 这里强制在 4 秒后放行 —— 宁可露出外壳，也好过给用户一张永远空着的页面。
  // 放在 head 里最早执行，保证它先于任何可能出错的代码注册。
  setTimeout(function () {
    var el = document.documentElement;
    el.classList.remove('booting');
    // login-open 挂着、登录框却没建起来，说明 showLogin 中途出错了，一并放行。
    // 登录框真的在，就别动 —— 那时候藏住外壳是对的。
    if (!document.getElementById('login-mask')) el.classList.remove('login-open');
  }, 4000);
</script>
<noscript><style>
  /* 没有 JS 就没人撤遮挡，也不会有登录框，直接让遮挡失效。 */
  html.booting body > header,
  html.booting body > main,
  html.booting body > footer { visibility: visible; }
  html.booting body::before,
  html.booting body::after { display: none; }
</style></noscript>
</head>
<body>

<!-- 键盘用户不必 Tab 过顶栏与工具栏的十几个控件才能进列表。 -->
<a class="skip-link" href="#table" id="skip-to-list">跳到文件列表</a>

<header class="topbar">
  <a class="brand" href="__GOFS_BASE__/" title="回到根目录">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    <span>gofs</span>
  </a>

  <!-- 文件管理器式的导航：后退 / 前进 / 上一级。
       三个按钮共用浏览器的历史栈 —— app.js 在 navigate() 里把「第几跳」
       写进 history.state.idx，所以地址栏、浏览器返回键、这几颗按钮永远同源，
       不会出现「按钮说能后退、浏览器却退不出去」的分裂。
       窄屏（≤820px）跟着全局的 `.btn span{display:none}` 收成纯图标，
       更窄时路径仍由面包屑承担，手机另有系统返回手势。 -->
  <div class="nav-btns" id="nav-btns">
    <button class="btn icon" id="btn-back" type="button" title="后退" aria-label="后退">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      <span>后退</span>
    </button>
    <button class="btn icon" id="btn-forward" type="button" title="前进" aria-label="前进">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      <span>前进</span>
    </button>
    <button class="btn icon" id="btn-up" type="button" title="上一级" aria-label="上一级">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      <span>上一级</span>
    </button>
  </div>

  <nav class="breadcrumb" id="breadcrumb" aria-label="路径"></nav>

  <div class="topbar-actions">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search-input" type="search" placeholder="模糊搜索…" autocomplete="off" spellcheck="false" aria-label="搜索文件">
      <!-- 搜索方式：复用顶栏下拉那套 .menu-wrap/.menu-pop。
           按钮故意不用 .btn —— ≤820px 的 `.btn span{display:none}` 会把
           「模糊/精确」这些标签藏掉，只剩一个没意义的箭头。 -->
      <div class="menu-wrap search-mode" id="search-mode-wrap">
        <button class="search-mode-btn" id="btn-search-mode" type="button"
                aria-haspopup="menu" aria-expanded="false" aria-controls="search-mode-menu">
          <svg class="mode-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>
          <span id="search-mode-label">模糊</span>
          <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="menu-pop" id="search-mode-menu" role="menu"></div>
      </div>
    </div>
    <button class="btn icon" id="btn-refresh" title="刷新" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </button>
    <!-- 上传做成分裂按钮：左边直接选文件（最常用的动作少一次点击），
         右边 caret 展开「上传文件夹」。两半共用 .menu-wrap 的浮层定位。 -->
    <div class="menu-wrap upload-split" id="upload-wrap">
      <button class="btn primary" id="btn-upload" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6"/><path d="m6 11 6-6 6 6"/><path d="M4 20h16"/></svg>
        <span>上传</span>
      </button>
      <button class="btn primary upload-caret" id="btn-upload-menu" type="button" hidden
              title="上传文件夹" aria-label="更多上传方式"
              aria-haspopup="menu" aria-expanded="false" aria-controls="upload-menu">
        <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="menu-pop" id="upload-menu" role="menu">
        <button class="menu-item" id="btn-upload-file" type="button" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
          <span>上传文件</span>
        </button>
        <button class="menu-item" id="btn-upload-dir" type="button" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5"/><path d="m9.5 13.5 2.5-2.5 2.5 2.5"/></svg>
          <span>上传文件夹</span>
        </button>
      </div>
    </div>

    <!-- 低频操作的可折叠组。
         桌面端 .more-wrap / .more-panel 都是 display: contents，里面的按钮
         仍然是 .topbar-actions 的直接弹性项 —— 排版与折叠前完全一致。
         手机端（≤560px）它变成「更多」下拉菜单，把顶栏从 200px 压回一行。

         ⚠️ 折叠**只改布局，不改可见性**：按钮的 hidden 属性照旧由权限控制，
         菜单项也可以被 hidden 掉。折叠与权限是两件事，别混在一起。 -->
    <div class="more-wrap" id="more-wrap">
      <button class="btn icon more-toggle" id="btn-more" type="button"
              title="更多操作" aria-label="更多操作" aria-expanded="false" aria-controls="more-panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        <span>更多</span>
      </button>
      <div class="more-panel" id="more-panel">
        <!-- 主题是三种状态（跟随系统 / 浅色 / 深色），单按钮循环切换
             看不出当前是哪一档。改成和搜索方式一致的下拉菜单。 -->
        <div class="menu-wrap" id="theme-wrap">
          <button class="btn icon" id="btn-theme" type="button" title="主题"
                  aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg>
            <span>主题</span>
            <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="menu-pop" id="theme-menu" role="menu"></div>
        </div>
        <div class="menu-wrap" id="mkdir-wrap">
          <button class="btn" id="btn-mkdir" type="button" hidden
                  aria-haspopup="menu" aria-expanded="false" aria-controls="mkdir-menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span>新建</span>
            <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="menu-pop" id="mkdir-menu" role="menu">
            <button class="menu-item" id="btn-new-file" type="button" role="menuitem">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 12v5M9.5 14.5h5"/></svg>
              <span>新建文件</span>
            </button>
            <button class="menu-item" id="btn-new-dir" type="button" role="menuitem">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>
              <span>新建文件夹</span>
            </button>
          </div>
        </div>
        <button class="btn" id="btn-settings" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 4.6 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 11 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 19.4 11a2 2 0 1 1 0 4z"/></svg>
          <span>设置</span>
        </button>
        <!-- 手机端的改密 / 退出入口：账号芯片只保留用户名，给路径腾出宽度。
             桌面端仍用芯片里的「改密」「退出」（这两颗由 CSS 隐藏）。 -->
        <button class="btn" id="btn-password-more" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span>修改密码</span>
        </button>
        <button class="btn" id="btn-logout-more" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          <span>退出登录</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 账号芯片放在 .topbar-actions 之外：
       桌面端它本来就是这个 flex 行的最后一个元素，位置不变；
       手机端要把它挪到第一行（跟路径并排），在里面就做不到。 -->
  <div class="user" id="user-chip" hidden></div>
</header>

<main class="content">
  <div class="toolbar" id="toolbar">
    <div class="toolbar-left">
      <!-- 统计随选择 / 搜索实时变化，读屏用户也应听到结果规模。 -->
      <span class="stat" id="stat" aria-live="polite" aria-atomic="true"></span>
      <label class="search-sort" id="search-sort" hidden>
        <span>排序</span>
        <select id="search-sort-select" aria-label="搜索结果排序"
                title="相关度：名称匹配程度优先，同分时更短的名字、更浅的路径靠前">
          <option value="relevance">相关度</option>
          <option value="name">名称</option>
          <option value="size">大小</option>
          <option value="mtime">修改时间</option>
        </select>
      </label>
    </div>
    <div class="toolbar-right">
      <button class="btn ghost" id="btn-zip" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h5l2 2h5a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M12 9v7"/><path d="m9 13 3 3 3-3"/></svg>
        <span>打包下载</span>
      </button>
      <!-- 顺序按「越靠左越不具破坏性」：改名只动名字，移动会换目录，
           删除是最后手段。三者的显隐条件一致（有选中 + 有权限）。 -->
      <button class="btn ghost" id="btn-rename-sel" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L18 10l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>
        <span>重命名所选</span>
      </button>
      <button class="btn ghost" id="btn-move-sel" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h3l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M9 13h7"/><path d="m13.5 10.5 2.5 2.5-2.5 2.5"/></svg>
        <span>移动所选</span>
      </button>
      <button class="btn danger" id="btn-delete-sel" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 12h10l1-12"/></svg>
        <span>删除所选</span>
      </button>
    </div>
  </div>

  <!-- 常驻的拖拽投放区。
       只靠「拖进来时才出现的浮层」不够：用户在没有开始拖之前，
       根本不知道这个页面支持拖拽上传。这里把能力写在页面上，
       并明确标出文件会落到哪个目录。

       位置在列表**上方**：它原本排在长列表之后，一屏之外的入口等于不存在 ——
       目录一长就得先滚到底才知道页面支持拖拽。放在前面还能顺带说清落点。
       手机端（触摸、窄屏）改写成一条紧凑的可点横条，那句「拖到这里」是错的，
       但「点一下就能选文件」依然成立。文案由 renderDropZone() 按屏宽生成。 -->
  <div class="drop-zone" id="drop-zone" hidden role="button" tabindex="0"
       aria-label="选择文件上传">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6"/><path d="m6 11 6-6 6 6"/><path d="M4 20h16"/></svg>
    <div class="drop-zone-text">
      <strong id="drop-zone-lead">把文件或文件夹拖到这里即可上传</strong>
      <span id="drop-zone-target">当前目录</span>
    </div>
  </div>

  <div class="table-wrap">
    <table class="listing" id="table" role="grid" aria-multiselectable="true"
           aria-label="文件与目录列表" tabindex="-1">
      <thead role="rowgroup">
        <tr role="row">
          <th class="col-check" scope="col" role="columnheader">
            <label class="check-hit">
              <input type="checkbox" id="check-all" aria-label="全选当前列表" title="全选当前列表">
            </label>
          </th>
          <th class="col-name sortable" data-sort="name" scope="col" role="columnheader">名称</th>
          <th class="col-size sortable" data-sort="size" scope="col" role="columnheader">大小</th>
          <th class="col-time sortable" data-sort="mtime" scope="col" role="columnheader">修改时间</th>
          <th class="col-ops" scope="col" role="columnheader">操作</th>
        </tr>
      </thead>
      <tbody id="tbody" role="rowgroup"></tbody>
    </table>
    <!-- 大目录分批渲染：首屏只画前 PAGE_SIZE 行，其余按需追加。
         放在 table 外、table-wrap 内，圆角与分隔线跟着卡片走。 -->
    <div class="load-more" id="load-more" hidden>
      <span id="load-more-text" aria-live="polite"></span>
      <button class="btn" id="btn-load-more" type="button">再显示</button>
    </div>
    <div class="empty" id="empty" hidden></div>
  </div>
</main>

<footer class="footer">
  <span id="footer-left">gofs</span>
  <span id="footer-right"></span>
</footer>

<div class="drop-hint" id="drop-hint">
  <div class="drop-hint-inner">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6"/><path d="m6 11 6-6 6 6"/><path d="M4 20h16"/></svg>
    <strong>松开即可上传</strong>
    <span id="drop-target">当前目录</span>
    <span class="drop-note" id="drop-note"></span>
  </div>
</div>

<div class="modal-root" id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="file-input" multiple hidden>
<!-- webkitdirectory：让浏览器把「选中的整个目录」递归展开成文件列表，
     每个文件带 webkitRelativePath（形如 apps/web/index.html）。
     非标准属性，Chromium / Safari / Firefox 现在都支持；不支持的浏览器
     会退化成普通的文件选择（用户仍可拖拽文件夹）。 -->
<input type="file" id="dir-input" webkitdirectory directory multiple hidden>

<script id="gofs-data" type="application/json">__GOFS_DATA__</script>
<script src="__GOFS_ASSETS__app.js"></script>
<script src="__GOFS_ASSETS__editor.js"></script>
<script src="__GOFS_ASSETS__keys.js"></script>
<script src="__GOFS_ASSETS__users.js"></script>
<script src="__GOFS_ASSETS__settings.js"></script>
</body>
</html>
