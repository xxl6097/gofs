<!DOCTYPE html>
<!-- class="booting" 是「启动遮挡」：页面外壳在服务端就渲染好了，但
     「要不要登录」得等 app.js 跑起来才知道。不挡住的话，未登录刷新时
     会先看到一眼完整的文件界面，再被登录框盖掉 —— 就是那个一闪而过的背景。
     撤除由 app.js 的 endBoot() 负责，样式见 style.css 的「启动遮挡」一节。 -->
<html lang="zh-CN" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>gofs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M8 11h6l2 2h8v9a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="__GOFS_ASSETS__style.css">
<script>
  // 兜底：万一 app.js 加载失败或中途抛异常，就没人来撤遮挡了。
  // 这里强制在 4 秒后放行 —— 宁可露出外壳，也好过给用户一张永远空着的页面。
  // 放在 head 里最早执行，保证它先于任何可能出错的代码注册。
  setTimeout(function () {
    var el = document.documentElement;
    el.classList.remove('booting');
    // login-open 挂着、登录框却没建起来，说明 showLogin 中途出错了，一并放行。
    // 登录框真的在，就别动 —— 那时候藏住外壳是对的。
    if (!document.getElementById('login-mask')) el.classList.remove('login-open');
  }, 4000);
</script>
<noscript><style>
  /* 没有 JS 就没人撤遮挡，也不会有登录框，直接让遮挡失效。 */
  html.booting body > header,
  html.booting body > main,
  html.booting body > footer { visibility: visible; }
  html.booting body::before,
  html.booting body::after { display: none; }
</style></noscript>
</head>
<body>

<header class="topbar">
  <a class="brand" href="__GOFS_BASE__/" title="回到根目录">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    <span>gofs</span>
  </a>

  <nav class="breadcrumb" id="breadcrumb" aria-label="路径"></nav>

  <div class="topbar-actions">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search-input" type="search" placeholder="搜索文件…" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn icon" id="btn-refresh" title="刷新" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </button>
    <button class="btn primary" id="btn-upload" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6"/><path d="m6 11 6-6 6 6"/><path d="M4 20h16"/></svg>
      <span>上传</span>
    </button>

    <!-- 低频操作的可折叠组。
         桌面端 .more-wrap / .more-panel 都是 display: contents，里面的按钮
         仍然是 .topbar-actions 的直接弹性项 —— 排版与折叠前完全一致。
         手机端（≤560px）它变成「更多」下拉菜单，把顶栏从 200px 压回一行。

         ⚠️ 折叠**只改布局，不改可见性**：按钮的 hidden 属性照旧由权限控制，
         菜单项也可以被 hidden 掉。折叠与权限是两件事，别混在一起。 -->
    <div class="more-wrap" id="more-wrap">
      <button class="btn icon more-toggle" id="btn-more" type="button"
              title="更多操作" aria-label="更多操作" aria-expanded="false" aria-controls="more-panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        <span>更多</span>
      </button>
      <div class="more-panel" id="more-panel">
        <button class="btn icon" id="btn-theme" title="切换主题" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg>
          <span>主题</span>
        </button>
        <button class="btn" id="btn-upload-dir" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5"/><path d="m9.5 13.5 2.5-2.5 2.5 2.5"/></svg>
          <span>文件夹</span>
        </button>
        <button class="btn" id="btn-mkdir" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>
          <span>新建</span>
        </button>
        <button class="btn" id="btn-keys" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="3.5"/><path d="m10.6 12.4 8.4-8.4"/><path d="M15.5 4.5h4v4"/></svg>
          <span>密钥</span>
        </button>
        <button class="btn" id="btn-users" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="10" cy="8" r="3.5"/><path d="M20 20v-1.4a3.5 3.5 0 0 0-2.6-3.4"/><path d="M15.4 4.7a3.5 3.5 0 0 1 0 6.6"/></svg>
          <span>用户</span>
        </button>
        <button class="btn" id="btn-settings" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 4.6 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 11 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 19.4 11a2 2 0 1 1 0 4z"/></svg>
          <span>设置</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 账号芯片放在 .topbar-actions 之外：
       桌面端它本来就是这个 flex 行的最后一个元素，位置不变；
       手机端要把它挪到第一行（跟路径并排），在里面就做不到。 -->
  <div class="user" id="user-chip" hidden></div>
</header>

<main class="content">
  <div class="toolbar" id="toolbar">
    <div class="toolbar-left">
      <label class="checkbox">
        <input type="checkbox" id="check-all">
        <span>全选</span>
      </label>
      <span class="stat" id="stat"></span>
    </div>
    <div class="toolbar-right">
      <button class="btn ghost" id="btn-zip" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h5l2 2h5a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M12 9v7"/><path d="m9 13 3 3 3-3"/></svg>
        <span>打包下载</span>
      </button>
      <!-- 移动排在删除前面：它是非破坏性的，而删除是最后手段。
           两者的显隐条件一致（有选中 + 有权限）。 -->
      <button class="btn ghost" id="btn-move-sel" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h3l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M9 13h7"/><path d="m13.5 10.5 2.5 2.5-2.5 2.5"/></svg>
        <span>移动所选</span>
      </button>
      <button class="btn danger" id="btn-delete-sel" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 12h10l1-12"/></svg>
        <span>删除所选</span>
      </button>
    </div>
  </div>

  <div class="table-wrap">
    <table class="listing" id="table">
      <thead>
        <tr>
          <th class="col-check"></th>
          <th class="col-name sortable" data-sort="name">名称</th>
          <th class="col-size sortable" data-sort="size">大小</th>
          <th class="col-time sortable" data-sort="mtime">修改时间</th>
          <th class="col-ops">操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>

  <!-- 常驻的拖拽投放区。
       只靠「拖进来时才出现的浮层」不够：用户在没有开始拖之前，
       根本不知道这个页面支持拖拽上传。这里把能力写在页面上，
       并明确标出文件会落到哪个目录。

       手机端（触摸、窄屏）改写成一条紧凑的可点横条，并挪到列表上方：
       手机不可能拖拽，原来那句「拖到这里」是错的；而且它原本排在长列表
       之后，一屏之外的入口等于不存在。文案由 renderDropZone() 按屏宽生成。 -->
  <div class="drop-zone" id="drop-zone" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6"/><path d="m6 11 6-6 6 6"/><path d="M4 20h16"/></svg>
    <div class="drop-zone-text">
      <strong id="drop-zone-lead">把文件或文件夹拖到这里即可上传</strong>
      <span id="drop-zone-target">当前目录</span>
    </div>
    <button class="btn" id="drop-zone-pick" type="button">选择文件…</button>
    <button class="btn" id="drop-zone-dir" type="button">选择文件夹…</button>
  </div>
</main>

<footer class="footer">
  <span id="footer-left">gofs</span>
  <span id="footer-right"></span>
</footer>

<div class="drop-hint" id="drop-hint">
  <div class="drop-hint-inner">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6"/><path d="m6 11 6-6 6 6"/><path d="M4 20h16"/></svg>
    <strong>松开即可上传</strong>
    <span id="drop-target">当前目录</span>
    <span class="drop-note" id="drop-note"></span>
  </div>
</div>

<div class="modal-root" id="modal-root"></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="file-input" multiple hidden>
<!-- webkitdirectory：让浏览器把「选中的整个目录」递归展开成文件列表，
     每个文件带 webkitRelativePath（形如 apps/web/index.html）。
     非标准属性，Chromium / Safari / Firefox 现在都支持；不支持的浏览器
     会退化成普通的文件选择（用户仍可拖拽文件夹）。 -->
<input type="file" id="dir-input" webkitdirectory directory multiple hidden>

<script id="gofs-data" type="application/json">__GOFS_DATA__</script>
<script src="__GOFS_ASSETS__app.js"></script>
<script src="__GOFS_ASSETS__editor.js"></script>
<script src="__GOFS_ASSETS__keys.js"></script>
<script src="__GOFS_ASSETS__users.js"></script>
<script src="__GOFS_ASSETS__settings.js"></script>
</body>
</html>
